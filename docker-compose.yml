# For more information: https://laravel.com/docs/sail
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-9/app
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
    mysql:
        image: 'mysql:8.0'
        command: --max_allowed_packet=536870912
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sailmysql:/var/lib/mysql'
            - './sql:/var/www/sql'
        networks:
            - sail
        healthcheck:
          test: ["CMD", "mysqladmin", "ping"]
    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '${MAIL_PORT:-1025}:1025'
            - '${MAIL_APP_PORT:-8025}:8025'
        networks:
            - sail
    adminer:
        image: adminer
        restart: always
        volumes:
            - './sql/adminer.sql.gz:/var/www/html/adminer.sql.gz'
        networks: 
            - sail
        ports:
         - 8005:8080
networks:
    sail:
        driver: bridge
volumes:
    sailmysql:
        driver: local
